name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valè bidon: build la ak tès yo pa bezwen vrè sekrè.
  JWT_SECRET: ci-secret
  TOTP_ENCRYPTION_KEY: ci-totp
  UPSTASH_REDIS_REST_URL: http://127.0.0.1:9
  UPSTASH_REDIS_REST_TOKEN: ci
  APP_URL: http://localhost:3100

jobs:
  quality:
    name: Typecheck · Lint · Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  e2e:
    name: Build · E2E (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pa bloke build la, men rapòte vulnérabilités yo.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
